name: Build XG-040G-MD OpenWrt

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Firmware source repository"
        type: choice
        required: true
        default: "openwrt/openwrt"
        options:
          - openwrt/openwrt
          - immortalwrt/immortalwrt
      base_branch:
        description: "Source branch (blank: OpenWrt main / ImmortalWrt master)"
        type: string
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache python3 python3-dev

      - name: Clone selected firmware source
        id: source
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo || 'openwrt/openwrt' }}
          SOURCE_BRANCH: ${{ inputs.base_branch }}
        run: |
          case "$SOURCE_REPO" in
            openwrt/openwrt)
              source_name=openwrt
              default_branch=main
              ;;
            immortalwrt/immortalwrt)
              source_name=immortalwrt
              default_branch=master
              ;;
            *)
              echo "::error::Unsupported source repository: $SOURCE_REPO"
              exit 1
              ;;
          esac
          source_branch="${SOURCE_BRANCH:-$default_branch}"
          git check-ref-format --branch "$source_branch"
          echo "name=$source_name" >> "$GITHUB_OUTPUT"
          echo "branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "artifact_branch=${source_branch//\//-}" >> "$GITHUB_OUTPUT"
          mkdir -p build-logs
          git clone --branch "$source_branch" "https://github.com/${SOURCE_REPO}.git" openwrt
          {
            echo "Repository: https://github.com/${SOURCE_REPO}"
            echo "Branch: $source_branch"
            git -C openwrt log -1 --format='%H %s'
          } | tee build-logs/source.txt
          cd openwrt
          git log --oneline -5

      - name: Copy local custom packages
        run: |
          cd openwrt
          mkdir -p package/custom
          cp -a ../local_packages/luci-app-wechatpush package/custom/luci-app-wechatpush
          cp -a ../local_packages/openwrt-passwall/luci-app-passwall package/custom/luci-app-passwall
          cp -a ../local_packages/openwrt-passwall-packages/. package/custom/
          echo "===== local custom packages ====="
          find package/custom -maxdepth 2 -name Makefile | sort

      - name: Fetch Argon theme from upstream
        shell: bash
        run: |
          cd openwrt
          mkdir -p ../build-logs
          git clone --depth 1 --branch master \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/custom/luci-theme-argon
          git -C package/custom/luci-theme-argon log -1 --format='%H %s' \
            | tee ../build-logs/argon-source.txt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        shell: bash
        run: |
          cd openwrt
          mkdir -p ../build-logs
          cp ../configs/xg040gmd.config .config
          cp .config ../build-logs/config.seed
          set -o pipefail
          make defconfig 2>&1 | tee ../build-logs/defconfig.log
          for symbol in \
            CONFIG_TARGET_airoha \
            CONFIG_TARGET_airoha_an7581 \
            CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_luci-ssl \
            CONFIG_PACKAGE_luci-theme-argon \
            CONFIG_PACKAGE_luci-app-wechatpush \
            CONFIG_PACKAGE_cloudflared \
            CONFIG_PACKAGE_luci-app-cloudflared \
            CONFIG_PACKAGE_luci-i18n-cloudflared-zh-cn \
            CONFIG_PACKAGE_luci-app-passwall; do
            if ! grep -qx "${symbol}=y" .config; then
              echo "::error::Required configuration missing: ${symbol}=y"
              exit 1
            fi
          done
          echo "===== target profile check ====="
          grep -E 'CONFIG_TARGET_airoha|CONFIG_TARGET.*xg|CONFIG_TARGET.*nokia|CONFIG_TARGET.*040' .config || true
          echo "===== luci/package check ====="
          grep -E 'CONFIG_PACKAGE_luci|CONFIG_PACKAGE_smartdns|CONFIG_PACKAGE_ttyd|CONFIG_PACKAGE_zerotier|CONFIG_PACKAGE_ddns|CONFIG_PACKAGE_bind|CONFIG_PACKAGE_resolveip|CONFIG_PACKAGE_ip-full|CONFIG_PACKAGE_jq|CONFIG_PACKAGE_jsonfilter|CONFIG_PACKAGE_mosquitto|CONFIG_PACKAGE_socat|CONFIG_PACKAGE_.*argon|CONFIG_PACKAGE_.*wechatpush|CONFIG_PACKAGE_.*passwall|CONFIG_PACKAGE_.*sing-box|CONFIG_PACKAGE_.*xray|CONFIG_PACKAGE_.*shadowsocks|CONFIG_PACKAGE_.*haproxy' .config || true

      - name: Download sources
        shell: bash
        run: |
          cd openwrt
          set -o pipefail
          make download -j"$(nproc)" V=s 2>&1 | tee ../build-logs/download.log

      - name: Build firmware
        shell: bash
        run: |
          cd openwrt
          mkdir -p ../build-logs
          set -o pipefail
          {
            git log -1 --format='%H %s'
            ./scripts/feeds list -s
            df -h
            free -h
          } > ../build-logs/build-info.txt 2>&1
          if make -j"$(nproc)" V=s 2>&1 | tee ../build-logs/build.log; then
            exit 0
          fi
          echo "Parallel build failed; retrying with one job for clearer diagnostics."
          make -j1 V=s 2>&1 | tee ../build-logs/build-retry.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xg040gmd-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/
            openwrt/logs/
            openwrt/.config
            openwrt/feeds.buildinfo
          include-hidden-files: true
          retention-days: 14

      - name: Collect firmware
        if: always()
        run: |
          mkdir -p artifact
          if [ -d openwrt/bin/targets ]; then
            cp -a openwrt/bin/targets artifact/targets
          fi
          if [ -f openwrt/.config ]; then
            cp openwrt/.config artifact/openwrt.config
          fi
          find artifact -maxdepth 5 -type f | sort

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xg040gmd-${{ steps.source.outputs.name || 'source' }}-${{ steps.source.outputs.artifact_branch || 'unknown' }}
          path: artifact
          retention-days: 14
